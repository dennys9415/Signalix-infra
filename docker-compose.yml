version: "3.9"

services:
  postgres:
    image: postgres:16
    env_file: env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10
    command: migrate
    env_file: env/flyway.env
    volumes:
      - ../Signalix-api/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Signalix-api/Dockerfile
    env_file: env/api.env
    ports:
      - "4000:4000"
    depends_on:
      flyway:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime:
    build:
      context: ..
      dockerfile: Signalix-realtime/Dockerfile
    env_file: env/realtime.env
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Signalix-frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:5000
    env_file: env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
