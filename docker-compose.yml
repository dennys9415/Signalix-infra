services:
  postgres:
    image: postgres:16
    env_file: env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10
    command: migrate
    env_file: env/flyway.env
    volumes:
      - ../Signalix-api/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signalix
      MINIO_ROOT_PASSWORD: signalix_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  createbuckets:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 signalix signalix_minio_password &&
      mc mb --ignore-existing local/signalix-avatars &&
      mc anonymous set download local/signalix-avatars &&
      mc mb --ignore-existing local/signalix-media &&
      mc anonymous set download local/signalix-media &&
      mc mb --ignore-existing local/signalix-files &&
      mc anonymous set download local/signalix-files &&
      echo 'Buckets ready.'"

  # v0.17.0 — STUN/TURN for WebRTC calls. Media between browsers relays
  # through here when a direct P2P path isn't possible (symmetric NAT,
  # mobile carriers, corporate firewalls). Credentials are short-lived
  # HMACs minted by the API (GET /api/v1/calls/ice-servers) from the same
  # TURN_SECRET. TURN_EXTERNAL_IP must be an address browsers can reach:
  # 127.0.0.1 for same-machine testing, the host LAN IP for other devices,
  # the public IP in production.
  coturn:
    image: coturn/coturn:4.6
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-signalix_turn_secret_local}
      - --realm=signalix.local
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      # Local dev only: lets two browsers on the same machine relay to each other.
      - --allow-loopback-peers
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Signalix-api/Dockerfile
    env_file: env/api.env
    # v0.17.0 — ICE servers handed to call clients. Kept here (not in
    # api.env) so TURN_SECRET has a single source shared with coturn.
    environment:
      ICE_STUN_URLS: stun:${TURN_EXTERNAL_IP:-localhost}:3478
      TURN_URLS: turn:${TURN_EXTERNAL_IP:-localhost}:3478?transport=udp,turn:${TURN_EXTERNAL_IP:-localhost}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:-signalix_turn_secret_local}
    ports:
      - "4000:4000"
    depends_on:
      flyway:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime:
    build:
      context: ..
      dockerfile: Signalix-realtime/Dockerfile
    env_file: env/realtime.env
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Signalix-frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:5000
        # v0.9.0 — leave "false" (default) to use real E2EE for direct text
        # messages. "true" forces the v0.8.0 plaintext-passthrough mock.
        NEXT_PUBLIC_E2EE_DEV_FALLBACK: "false"
    env_file: env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
