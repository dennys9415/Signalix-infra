services:
  postgres:
    image: postgres:16
    env_file: env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  flyway:
    image: flyway/flyway:10
    command: migrate
    env_file: env/flyway.env
    volumes:
      - ../Signalix-api/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signalix
      MINIO_ROOT_PASSWORD: signalix_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 signalix signalix_minio_password &&
      mc mb --ignore-existing local/signalix-avatars &&
      mc anonymous set download local/signalix-avatars &&
      mc mb --ignore-existing local/signalix-media &&
      mc anonymous set download local/signalix-media &&
      mc mb --ignore-existing local/signalix-files &&
      mc anonymous set download local/signalix-files &&
      echo 'Buckets ready.'"

  api:
    build:
      context: ..
      dockerfile: Signalix-api/Dockerfile
    env_file: env/api.env
    ports:
      - "4000:4000"
    depends_on:
      flyway:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  realtime:
    build:
      context: ..
      dockerfile: Signalix-realtime/Dockerfile
    env_file: env/realtime.env
    ports:
      - "5000:5000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: Signalix-frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: ws://localhost:5000
        # v0.9.0 — leave "false" (default) to use real E2EE for direct text
        # messages. "true" forces the v0.8.0 plaintext-passthrough mock.
        NEXT_PUBLIC_E2EE_DEV_FALLBACK: "false"
    env_file: env/frontend.env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
